name: Windows Moo-Quest server gameplay

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-node:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout native client and OWN Node server
        uses: actions/checkout@v4
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies on Windows
        shell: pwsh
        run: |
          npm install --omit=dev --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "npm failed" }
          npm run test:node
          if ($LASTEXITCODE -ne 0) { throw "original packet tests failed" }
      - name: Recover 180 original images and convert WebP on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if (Test-Path 'node-runtime') { throw "CI must start without old art folders" }
          node tools/sync-reference-art.mjs
          if ($LASTEXITCODE -ne 0) { throw "Windows art download / WEBP conversion failed" }
          node --input-type=module -e "import fs from 'node:fs';const m=JSON.parse(fs.readFileSync('support/reference-image-manifest.json'));let n=0;for(const [cat,names] of Object.entries(m)){for(const f of names){const b=fs.readFileSync('assets/reference/img/'+cat+'/'+f);if(b.subarray(0,8).toString('hex')!=='89504e470d0a1a0a')throw Error(cat+'/'+f+' not PNG');n++}}if(n!==180)throw Error('Expected 180 real PNG files');console.log('PASS: 180 valid-signature PNG sprites on Windows');"
          if ($LASTEXITCODE -ne 0) { throw "Windows art validation failed" }
          $env:MOOQUEST_ART_OFFLINE = '1'
          node tools/sync-reference-art.mjs
          if ($LASTEXITCODE -ne 0) { throw "Offline Windows restart failed" }
      - name: Test actual bundled server, local economy and authenticated spawn
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:MOOQUEST_SERVER_DIR=(Get-Location).Path
          $env:MOOQUEST_EXPECT_ZERO_RESOURCES='1'
          $stdout=Join-Path $env:RUNNER_TEMP 'own-node.stdout.log'
          $stderr=Join-Path $env:RUNNER_TEMP 'own-node.stderr.log'
          $server=Start-Process -FilePath (Get-Command node).Source -ArgumentList 'server/src/index.js' -WorkingDirectory (Get-Location).Path -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $ready=$false
            for($i=0; $i -lt 80; $i++) {
              try {
                $s=Invoke-RestMethod 'http://127.0.0.1:8080/mooquest/status' -TimeoutSec 2
                if($s.project -eq 'Moo-Quest' -and $s.economy -eq 'gather') {
                  $ready=$true
                  break
                }
              } catch {}
              Start-Sleep -Milliseconds 200
            }
            if(-not $ready) { throw "Our Node server never reported gather mode" }
            node tools/check-node-spawn.mjs
            if($LASTEXITCODE -ne 0) { throw "Node M->C->D or economy check failed" }
            $build=(& node tools/resolve-local-build.mjs).Trim()
            if($LASTEXITCODE -ne 0 -or -not (Test-Path $build)){
              throw "Could not resolve build generated by our own Node server"
            }
            Write-Host 'PASS: own Windows Node fork starts in gather mode, authenticated spawn works'
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
            if(Test-Path $stdout) { Get-Content $stdout -Tail 30 }
            if(Test-Path $stderr) { Get-Content $stderr -Tail 30 }
          }
