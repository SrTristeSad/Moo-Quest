name: MooQuest independent Node.js server V2
on:
  push:
    branches: [main]
    paths: ['server-v2/**', '.github/workflows/server-v2.yml']
  pull_request:
    paths: ['server-v2/**', '.github/workflows/server-v2.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standalone-server:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      MOO_TEST_DATABASE_URL: postgresql://mooquest:integration-test-only@127.0.0.1:5432/mooquest
      MOO_TEST_REDIS_URL: redis://127.0.0.1:6379
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mooquest
          POSTGRES_USER: mooquest
          POSTGRES_PASSWORD: integration-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mooquest -d mooquest"
          --health-interval 10s --health-timeout 5s --health-retries 8
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 8
    steps:
      - uses: actions/checkout@v4
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify no legacy imports or third-party artwork
        run: |
          test ! -d server-v2/assets
          ! find server-v2 -type f \( -iname '*.png' -o -iname '*.webp' -o -iname '*.jpg' \) | grep .
          ! grep -R -E 'moomoo-clone|al007ex/moomoo' server-v2/src server-v2/public
      - name: Enforce standalone release file/import boundary
        run: node server-v2/scripts/check-release-boundary.mjs
      - name: Install independent Node server dependencies
        run: npm install --prefix server-v2 --no-audit --no-fund
      - name: Run security, game and live WebSocket integration tests
        run: npm test --prefix server-v2
      - name: Check syntax, admin pages and signed release publisher
        run: |
          node --check server-v2/bootstrap.js
          node --check server-v2/setup-server.js
          node --check server-v2/src/index.js
          node --check server-v2/src/http.js
          node --check server-v2/src/updates.js
          node --check server-v2/scripts/db-backup.mjs
          test -f server-v2/public/admin.html
          test -f server-v2/scripts/make-release.mjs
