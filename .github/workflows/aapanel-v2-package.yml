name: MooQuest V2 complete aaPanel installation ZIP
on:
  push:
    branches: [main, 'fix/**', 'feat/**']
    paths: ['server-v2/**', '.github/workflows/aapanel-v2-package.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install runtime dependencies for Linux
        run: npm install --omit=dev --no-audit --no-fund --prefix server-v2
      - name: Build full self-contained server ZIP
        run: |
          set -euo pipefail
          mkdir -p dist/package
          cp -a server-v2/. dist/package/
          rm -rf dist/package/var
          rm -f dist/package/.env
          test -s dist/package/bootstrap.js
          test -s dist/package/setup-server.js
          test -s dist/package/public/setup-infrastructure.html
          test -s dist/package/public/setup-infrastructure.css
          test -s dist/package/public/setup-infrastructure.js
          test -d dist/package/node_modules/pg
          test -d dist/package/node_modules/redis
          test -d dist/package/node_modules/ws
          test -d dist/package/node_modules/yauzl
          test -f dist/package/src/zip-release.js
          test -f dist/package/docs/UPDATE-ZIP-AAPANEL.md
          ! grep -Eq '<style([ >])|style="' dist/package/public/setup-infrastructure.html
          node --check dist/package/bootstrap.js
          node --check dist/package/setup-server.js
          cat > dist/package/LEIA-PRIMEIRO.txt <<'EOF'
          MOO-QUEST V2 - INSTALACAO GUIADA PARA AAPANEL
          
          Este ZIP pode ser extraido DIRETAMENTE na pasta do app no aaPanel.
          Ele inclui TODO o codigo independente Node.js do servidor,
          painel, scripts, dependencias Linux e testes. Nenhum download do
          repositorio GitHub e feito durante a instalacao.

          1. PARE o Node no aaPanel e copie seus dados/bancos atuais.
             Extraia na RAIZ do projeto ja usado (bootstrap.js e package.json
             ficam diretamente na raiz, sem subpasta extra).
             NAO APAGUE o diretorio var, MOO_DATA_DIR ou o .env existente.
          2. Instale PostgreSQL 17 e Redis 7 no aaPanel ou por Docker
             usando o compose.yaml incluido, e inicie esses servicos.
          3. Crie um projeto Node.js >=22 no aaPanel, com diretorio
             a pasta do site (onde estao bootstrap.js e package.json).
             Use MOO_PORT=8100 e MOO_HOST=127.0.0.1.
          4. Crie um site HTTPS com proxy reverso para 127.0.0.1:8100.
             Restrinja a porta 8100 e o Nginx nao deve servir var/ ou .env.
             Recomendado: MOO_DATA_DIR fora do webroot do Nginx.
          5. Execute o projeto. Abra /setup no dominio e use o codigo
             de 6 digitos que o aaPanel exibira nos logs do Node.
          6. Informe as credenciais de PostgreSQL e Redis NA PAGINA e
             teste os dois servicos. Crie o administrador e finalize.
             O instalador grava as credenciais em arquivo privado 0600 e
             inicia automaticamente o motor do jogo.
          7. A nova tela tem CSS externo. Se a interface antiga permanecer,
             limpe cache do navegador com Ctrl+F5 e confira que a rota
             /setup/infrastructure.css carrega com HTTP 200.
          8. Em partidas publicas, o cliente Lua ainda exige evolucao
             para HTTPS/WSS e Turnstile; use a VPS para homologacao,
             painel e bancos, nao como jogo publico concluido.

          ATUALIZACOES FUTURAS PELO PAINEL:
          1. Abra /admin e va em Atualizacoes.
          2. Em Atualizacao por arquivo ZIP, selecione este mesmo formato
             de pacote completo do MooQuest V2, confirme a origem e envie.
          3. Clique em Ativar versao preparada e REINICIE o Node no aaPanel.
          4. Se necessario use Reverter e reinicie de novo.
          O envio de ZIP exige conta admin e nao pede senha sudo. O
          atualizador troca apenas src/ e public/; nao substitui
          as credenciais privadas ou o banco de dados. Use apenas ZIP
          de origem confiavel: upload manual nao verifica assinatura.
          Manual: docs/UPDATE-ZIP-AAPANEL.md.

          NOTA: O ZIP nao inclui os executaveis de PostgreSQL, Redis ou
          Node.js; esses servicos sao fornecidos pela VPS/aaPanel.
          Nunca exponha os bancos diretamente na internet.
          EOF
          cd dist/package
          zip -qr ../MooQuest-V2-aaPanel-INSTALACAO-COMPLETA.zip .
          cd ..
          unzip -tq MooQuest-V2-aaPanel-INSTALACAO-COMPLETA.zip
          sha256sum MooQuest-V2-aaPanel-INSTALACAO-COMPLETA.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MooQuest-V2-aaPanel-INSTALACAO-COMPLETA
          path: dist/MooQuest-V2-aaPanel-INSTALACAO-COMPLETA.zip
          retention-days: 14
          if-no-files-found: error
