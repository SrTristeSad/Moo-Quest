name: Lua module tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lua:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['5.1', '5.4']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Lua interpreter
        run: |
          sudo apt-get update
          sudo apt-get install -y lua${{ matrix.version }}
      - name: Test WebSocket and handshake for unmodified original Node server
        run: |
          set -eu
          for test in tests/handshake.lua tests/msgpack.lua tests/msgpack_gameplay.lua tests/bootstrap.lua tests/upgrade.lua tests/websocket_frames.lua tests/websocket_client.lua tests/original_client.lua tests/original_join.lua tests/original_session.lua tests/catalog.lua; do
            echo "RUN $test"
            lua${{ matrix.version }} "$test"
          done
