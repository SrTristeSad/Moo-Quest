name: Lua module tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lua:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['5.1', '5.4']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Lua interpreter
        run: |
          sudo apt-get update
          sudo apt-get install -y lua${{ matrix.version }}
      - name: Test active Lua client and Node protocol adapters
        run: |
          set -eu
          for test in tests/msgpack.lua tests/msgpack_gameplay.lua tests/local_frames.lua tests/local_client.lua tests/node_protocol.lua tests/catalog.lua; do
            echo "RUN $test"
            lua${{ matrix.version }} "$test"
          done
