name: Lua module tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lua:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['5.1', '5.4']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Lua interpreter
        run: |
          sudo apt-get update
          sudo apt-get install -y lua${{ matrix.version }}
      - name: Test WebSocket and handshake for unmodified original Node server
        run: |
          set -eu
          for test in tests/handshake.lua tests/msgpack.lua tests/msgpack_gameplay.lua tests/bootstrap.lua tests/upgrade.lua tests/websocket_frames.lua tests/websocket_client.lua tests/original_client.lua tests/original_join.lua tests/original_session.lua tests/build_lookup.lua tests/catalog.lua tests/world_state.lua tests/reference_render.lua tests/reference_animation.lua tests/reference_combat_text.lua tests/reference_boss_effects.lua tests/reference_server_notices.lua tests/reference_secret_map.lua tests/reference_projectile_layers.lua tests/reference_entity_order.lua tests/reference_cosmetic_edges.lua tests/reference_profile.lua tests/reference_upgrades.lua tests/reference_hud.lua tests/reference_item_info.lua tests/reference_weapon_assets.lua tests/reference_sprite_catalog.lua tests/reference_death.lua tests/reference_camera.lua tests/reference_menu.lua tests/reference_panels.lua tests/local_auth.lua tests/json.lua tests/clan_api.lua tests/account_clans.lua; do
            echo "RUN $test"
            lua${{ matrix.version }} "$test"
          done
