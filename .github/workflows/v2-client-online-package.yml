name: MooQuest V2 Windows Online Client Package
on:
  push:
    branches: [main, 'fix/client-v2-preserve-legacy-art-20261022', 'feat/v2-windows-remote-https-client', 'fix/windows-client-safe-node-launcher', 'fix/windows-client-remove-unused-legacy-js', 'fix/v2-online-login-connection-ui', 'fix/v2-online-api-nonjson-response', 'feat/client-v2-admission-policy-ui', 'fix/v2-luasocket-te-header-relay', 'fix/v2-authenticated-ws-proxy-ip-drift', 'fix/v2-relay-keepalive-compatibility', 'fix/v2-ws-handshake-diagnostics']
    paths:
      - 'tools/v2-https-relay.mjs'
      - 'tools/v2-https-relay.test.mjs'
      - 'tools/v2-live-api-check.mjs'
      - 'tools/v2-live-ws-route-check.mjs'
      - 'tools/v2-public-ws-check.mjs'
      - 'tools/run-v2-online.mjs'
      - 'tools/run-v2-online.test.mjs'
      - 'JOGAR-V2-ONLINE-WINDOWS.bat'
      - 'IMPORTAR-ARTES-ANTIGAS.bat'
      - 'tools/importar-artes-antigas.mjs'
      - 'tools/importar-artes-antigas.test.mjs'
      - 'main.lua'
      - 'assets/**'
      - 'src/**'
      - 'shared/**'
      - 'docs/CLIENTE-V2-ONLINE-AAPANEL.md'
      - '.github/workflows/v2-client-online-package.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-client:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check secured relay
        run: node --check tools/v2-https-relay.mjs
      - name: Verify Node launcher and secure transport syntax
        run: |
          node --check tools/run-v2-online.mjs
          node --check tools/v2-https-relay.mjs
      - name: Functional HTTPS TLS, WebSocket and old-client art recovery tests
        run: node --test tools/v2-https-relay.test.mjs tools/run-v2-online.test.mjs tools/importar-artes-antigas.test.mjs
      - name: Check the configured public server without blocking packaging
        continue-on-error: true
        run: |
          node --input-type=module -e 'try {const r=await fetch("https://app.snusnu.com.br/ping",{signal:AbortSignal.timeout(8000)});const j=await r.json();if(r.status!==200||j.build!=="mqv2native")throw Error("Unexpected remote /ping response: "+r.status);console.log("REMOTE_API_OK build="+j.build)}catch(e){console.error("REMOTE_API_UNVERIFIED: "+e.message);process.exitCode=1}'
      - name: Smoke-test the actual pinned TLS relay with the remote /ping
        continue-on-error: true
        run: |
          node --input-type=module -e 'import {createSecureRelay} from "./tools/v2-https-relay.mjs"; const bridge=createSecureRelay({listenPort:0});try{const address=await bridge.listen();const r=await fetch("http://127.0.0.1:"+address.port+"/ping",{signal:AbortSignal.timeout(8000)});const j=await r.json();if(r.status!==200||j.build!=="mqv2native")throw Error("Unexpected bridge /ping");console.log("PINNED_HTTPS_RELAY_OK "+j.build)}catch(e){console.error("PINNED_HTTPS_RELAY_UNVERIFIED: "+e.message);process.exitCode=1}finally{await bridge.close()}'
      - name: Inspect live register/login HTTP response format through TLS bridge (no credentials)
        continue-on-error: true
        run: node tools/v2-live-api-check.mjs
      - name: Probe public WebSocket upgrade path without using a real account
        continue-on-error: true
        run: node tools/v2-public-ws-check.mjs
      - name: Probe remote /s/LC upgrade using invalid ticket (no credentials)
        continue-on-error: true
        run: node tools/v2-live-ws-route-check.mjs
      - name: Package all first-party Lua client sources
        run: |
          set -euo pipefail
          mkdir -p dist/MooQuest-V2-ONLINE/tools
          cp main.lua conf.lua JOGAR-V2-ONLINE-WINDOWS.bat dist/MooQuest-V2-ONLINE/
          cp -a src tests dist/MooQuest-V2-ONLINE/
          mkdir -p dist/MooQuest-V2-ONLINE/support
          cp support/reference-image-manifest.json dist/MooQuest-V2-ONLINE/support/
          # The Lua runtime uses its own src/game/catalog.lua: vendored
          # server-side shared/config/*.js is not a client dependency.
          test ! -d dist/MooQuest-V2-ONLINE/shared
          cp tools/v2-https-relay.mjs tools/run-v2-online.mjs dist/MooQuest-V2-ONLINE/tools/
          mkdir -p dist/MooQuest-V2-ONLINE/assets/custom/img
          cp -a assets/custom/img/. dist/MooQuest-V2-ONLINE/assets/custom/img/
          test "$(find dist/MooQuest-V2-ONLINE/assets/custom/img -name '*.png' | wc -l)" -eq 176
          python3 -c "from pathlib import Path; fs=list(Path('dist/MooQuest-V2-ONLINE/assets/custom/img').rglob('*.png')); assert len(fs)==176 and all(f.read_bytes().startswith(bytes([137,80,78,71,13,10,26,10])) for f in fs), 'invalid PNG in package'"
          test ! -f dist/MooQuest-V2-ONLINE/tools/run-v2-online.ps1
          ! grep -R -Ei 'ExecutionPolicy|Bypass|powershell.exe' dist/MooQuest-V2-ONLINE/JOGAR-V2-ONLINE-WINDOWS.bat dist/MooQuest-V2-ONLINE/tools/run-v2-online.mjs
          cp docs/CLIENTE-V2-ONLINE-AAPANEL.md dist/MooQuest-V2-ONLINE/LEIA-PRIMEIRO.md
          test "$(find dist/MooQuest-V2-ONLINE -name '*.bat' | wc -l)" -eq 1
          test -s dist/MooQuest-V2-ONLINE/main.lua
          test -s dist/MooQuest-V2-ONLINE/tools/v2-https-relay.mjs
          test -s dist/MooQuest-V2-ONLINE/src/game/reference_view.lua
          test -s dist/MooQuest-V2-ONLINE/src/game/v2_login_screen.lua
          test -s dist/MooQuest-V2-ONLINE/src/net/v2_accounts.lua
          test -s dist/MooQuest-V2-ONLINE/src/net/websocket_client.lua
          test ! -d dist/MooQuest-V2-ONLINE/server
          test ! -d dist/MooQuest-V2-ONLINE/server-v2
          # Release includes only the two explicitly reviewed Node transport
          # modules, not unrelated legacy JavaScript configurations.
          unexpected=$(find dist/MooQuest-V2-ONLINE -type f -name '*.js' -print)
          test -z "$unexpected"
          test -f dist/MooQuest-V2-ONLINE/tools/run-v2-online.mjs
          test -f dist/MooQuest-V2-ONLINE/tools/v2-https-relay.mjs
          cd dist
          zip -qr MooQuest-V2-CLIENTE-ONLINE-WINDOWS.zip MooQuest-V2-ONLINE
          unzip -tq MooQuest-V2-CLIENTE-ONLINE-WINDOWS.zip
          sha256sum MooQuest-V2-CLIENTE-ONLINE-WINDOWS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MooQuest-V2-CLIENTE-ONLINE-WINDOWS
          path: dist/MooQuest-V2-CLIENTE-ONLINE-WINDOWS.zip
          retention-days: 14
          if-no-files-found: error

  windows-launcher-check:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate Node launcher on Windows
        run: |
          node --check tools/run-v2-online.mjs
          node --test tools/run-v2-online.test.mjs tools/importar-artes-antigas.test.mjs
